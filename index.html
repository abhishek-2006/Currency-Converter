<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <meta name="google-site-verification" content="o9RAO8Fk9Pu0NWEmCv4xW7Vlftk6N-K7m9otUXcGxds" />
    <meta name="msvalidate.01" content="4029A6DB07AC15E01324DF3414E63DDF" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { darkMode: 'media' }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .dark .glass { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); }
        body { background: #0f172a; color: #f8fafc; overflow-x: hidden; }
        .grid-bg { background-image: radial-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px); background-size: 30px 30px; }
        .chart-pulse { height: 2px; background: linear-gradient(90deg, transparent, #6366f1, transparent); animation: sweep 3s linear infinite; }
        @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    </style>
</head>
<body class="grid-bg min-h-screen p-4 md:p-10 font-sans transition-colors duration-500">

    <div class="max-w-7xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center gap-6 mb-12 border-b border-white/10 pb-8">
            <div class="flex items-center gap-5">
                <img src="logo.png" alt="Logo" class="w-12 h-12 rounded-xl ring-2 ring-indigo-500/20">
                <div>
                    <h1 class="text-2xl font-black italic tracking-tighter uppercase leading-none">Global<span class="text-indigo-500">Converter</span></h1>
                    <p class="text-[9px] font-mono font-bold text-slate-400 tracking-[0.4em] mt-1">NATION CURRENCIES ONLY • NO CRYPTO</p>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-right hidden sm:block">
                    <p id="marketStatus" class="text-[10px] font-bold text-green-500 uppercase tracking-widest flex items-center gap-2 justify-end">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> Market Live
                    </p>
                    <p id="timestamp" class="text-[9px] font-mono text-slate-500 mt-1 uppercase">Synced: --:--:--</p>
                </div>
                <button id="refreshBtn" class="p-3 glass rounded-full hover:text-indigo-500 transition-all active:scale-90"><i class="fas fa-sync-alt text-sm"></i></button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <main class="lg:col-span-8 space-y-8">
                <div class="glass rounded-[2rem] p-10 md:p-16 relative overflow-hidden group">
                    <div class="chart-pulse absolute top-0 left-0 w-full opacity-30"></div>
                    
                    <div class="grid grid-cols-1 gap-12 relative z-10">
                        <div class="space-y-4">
                            <label class="text-[10px] font-mono font-bold text-slate-500 uppercase tracking-widest">Base Amount</label>
                            <div class="flex flex-col md:flex-row gap-6">
                                <input type="number" id="amount" value="1000.00" class="flex-1 bg-transparent text-7xl font-black outline-none tabular-nums text-white focus:text-indigo-400 transition-all">
                                <select id="fromSelect" class="bg-white/5 dark:bg-slate-900/50 p-5 rounded-2xl font-bold text-xl outline-none cursor-pointer border border-white/10 hover:border-indigo-500/50 transition-all"></select>
                            </div>
                        </div>

                        <div class="flex items-center gap-4">
                            <div class="h-px flex-1 bg-white/10"></div>
                            <button id="swapBtn" class="w-14 h-14 glass rounded-full hover:rotate-180 hover:scale-110 transition-all duration-700 flex items-center justify-center border-indigo-500/30">
                                <i class="fas fa-exchange-alt text-indigo-500"></i>
                            </button>
                            <div class="h-px flex-1 bg-white/10"></div>
                        </div>

                        <div class="space-y-4">
                            <label class="text-[10px] font-mono font-bold text-slate-500 uppercase tracking-widest">Institutional Rate</label>
                            <div class="flex flex-col md:flex-row gap-6">
                                <div id="result" class="flex-1 text-7xl font-black text-indigo-500 tabular-nums truncate">0.00</div>
                                <select id="toSelect" class="bg-white/5 dark:bg-slate-900/50 p-5 rounded-2xl font-bold text-xl outline-none cursor-pointer border border-white/10 hover:border-indigo-500/50 transition-all"></select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass rounded-3xl p-8 flex items-center justify-between group cursor-help">
                        <div>
                            <p class="text-[10px] font-bold text-slate-500 uppercase">Conversion Accuracy</p>
                            <h4 id="rateDetail" class="text-lg font-mono font-bold mt-1 text-indigo-400">1.0000 = 1.0000</h4>
                        </div>
                        <i class="fas fa-info-circle text-slate-600 group-hover:text-indigo-500 transition"></i>
                    </div>
                    <div class="glass rounded-3xl p-8">
                        <p class="text-[10px] font-bold text-slate-500 uppercase mb-3">Live Feed Strength</p>
                        <div class="flex gap-1 h-2">
                            <div class="flex-1 bg-indigo-500 rounded-full"></div>
                            <div class="flex-1 bg-indigo-500 rounded-full"></div>
                            <div class="flex-1 bg-indigo-500 rounded-full"></div>
                            <div class="flex-1 bg-slate-700 rounded-full"></div>
                        </div>
                    </div>
                </div>
            </main>

            <aside class="lg:col-span-4 space-y-6">
                <div class="flex items-center justify-between mb-2 px-2">
                    <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest">Multi-Market Watch</h3>
                    <button id="toggleDash" class="text-[10px] font-bold text-indigo-500 hover:text-indigo-400 uppercase tracking-tighter">Hide Watchlist</button>
                </div>

                <div id="dashGrid" class="space-y-4">
                    </div>

                <div class="glass rounded-[2rem] p-8 space-y-6">
                    <h4 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em]">Asset Composition</h4>
                    <div class="flex h-1.5 rounded-full overflow-hidden bg-slate-800">
                        <div class="w-3/5 bg-indigo-500"></div>
                        <div class="w-1/5 bg-blue-400"></div>
                        <div class="w-1/5 bg-slate-600"></div>
                    </div>
                    <div class="flex justify-between text-[8px] font-bold text-slate-500 uppercase">
                        <span>Majors (G10)</span>
                        <span>Emerging</span>
                        <span>Minors</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
